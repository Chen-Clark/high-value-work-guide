    <div class="intro">
      <h1>高性价比打工指南</h1>
      <p>写给所有靠工资过日子的人。从接 offer 到离职，20 节，把该拿的钱拿到位，把不该吃的亏避开。</p>
      <p>每条一句话，能直接照做；涉及钱和法律的，给数字、给边界、给依据；没硬证据的，标"经验判断"。</p>
      <div class="meta" id="meta"></div>
    </div>
    <div id="content"></div>
    <div class="empty hidden" id="empty">没有匹配的条目，换个词试试。</div>
    <footer>内容仅供常识参考，不构成法律意见；政策以成文时为准，具体以当地最新规定为准。</footer>
  </main>

<script>
const DATA = [{"n":1,"t":"不要白干：接 offer 前先算账","items":[{"n":1,"t":"把税前月薪换成时薪再比。","b":"<p>两份 offer，一个 15000 但每天干到九点，一个 13000 准点下班，哪个划算？算时薪：月薪 ÷（每天实际工作小时 × 每月工作天数）。前一个可能时薪 70，后一个 85。数字一摆出来，选择就有了。别被月薪那个大数晃了眼。</p>"},{"n":2,"t":"薪资结构拆开看。","b":"<p>固定、绩效、奖金各占多少？只按固定部分算保底收入。写\"综合月薪 20000，其中固定 12000、绩效 8000\"的，你先把 12000 当真。绩效那部分能不能拿到，取决于考核规则、取决于领导、取决于公司当年的脸色——这三样你入职前都控制不了。</p>"},{"n":3,"t":"试用期工资有下限。","b":"<p>法定下限是：不低于本单位相同岗位最低档工资，或者劳动合同约定工资的 80%（两个标准满足其一），同时不能低于当地最低工资标准（《劳动合同法》第 20 条）。注意——<strong>打八折本身是合法的，那正是法定下限</strong>；低于八折、或低于最低工资，才违规。谈的是 15000，试用期只给 9000（六折），就是违规。把数字写进合同，别让\"试用期工资\"变成一句话。</p>"},{"n":4,"t":"问清税前税后、13 薪还是\"年底视情况\"。","b":"<p>\"我们这里都发 13 薪\"和\"合同写明年终奖根据公司经营情况确定\"，是两回事。前者是习惯，后者是空话。签字前让对方指着条款给你看——指不出来的，就当它不存在。</p>"},{"n":5,"t":"社保基数和公积金比例，问一句不吃亏。","b":"<p>按最低基数交和按实际工资交，到手差几百，但公积金贷款额度、养老金、生育津贴全跟着变。公积金 5% 和 12%，一年差出一个月工资。这些数字 HR 都能答，问清楚再定。</p>"},{"n":6,"t":"把通勤时间算进成本。","b":"<p>单程 1 小时，一天 2 小时，一个月按 22 个工作日算就是 44 小时。你等于每月白送出去两个工作日。房租贵一点但住得近，算总账可能更划算。这笔账很多人不算，直到每天挤地铁挤到怀疑人生。</p>"},{"n":7,"t":"算净收入，不算毛收入。","b":"<p>扣掉房租、通勤、置装、加班餐、应酬，剩下的才是你能支配的钱。一份\"高薪\"工作如果逼你在市中心租贵房、穿得体面、天天打车加班，净收入可能还不如一份普通工作。</p>"},{"n":8,"t":"查一眼这家公司。","b":"<p>劳动仲裁记录、失信被执行信息、最近的裁员新闻，网上都能查到。花十分钟搜一下，比听 HR 讲一小时靠谱。尤其注意劳动仲裁多的公司——说明不是员工出了问题，就是公司出了问题。</p>"},{"n":9,"t":"别为\"大厂光环\"接受明显低于市场的价。","b":"<p>履历不是工资单。为了一个名字少拿几千块，还得跟自己说\"这是投资\"——可以，但先算清楚这笔投资几年能回本。回不了本的，就是自我安慰。</p>"},{"n":10,"t":"同时拿到两个 offer，用书面谈。","b":"<p>把 A 家的薪资发给 B 家，说\"这边有个差不多的机会，你们这边能不能再看看\"——用邮件或微信文字，别打电话。文字留痕，对方也不好意思随口敷衍。注意措辞，别直接报出具体数字施压，说\"期望能更接近我的预期\"就够。</p>"},{"n":11,"t":"年终奖、调薪机制问不清就当没有。","b":"<p>\"表现好年底会有\"——好是多少？什么叫表现好？去年发几个月？这些问题问出来，答案越具体越可信。含糊其辞的，你心里按零算，反倒踏实。</p>"},{"n":12,"t":"空窗期先算活命钱。","b":"<p>没工作几个月还能撑得住？存款 ÷ 每月必要开支 = 你能扛几个月。算清楚这个数，才不会在焦虑里随便接个烂活。找工作最怕的不是挑，是慌。</p>"},{"n":13,"t":"接了 offer 又反悔，早点说。","b":"<p>入职前一天放鸽子，圈子比你想的小。真有变故，提前几天说清楚、道歉到位，多数人能理解。拖到最后一天才说，就别怪别人记你一笔。</p><p>---</p>"}]},{"n":2,"t":"不要签错字：合同与试用期","items":[{"n":1,"t":"拿到书面 offer 再提离职。","b":"<p>口头承诺不算数。HR 电话里说\"没问题，下周发 offer\"，你这边就把辞职信交了——结果 offer 没来，工作也没了。等那封盖着章的邮件到手，白纸黑字写着岗位、薪资、入职日期，再提辞职。哪怕对方催得急，也值得多等两三天。</p>"},{"n":2,"t":"看清跟你签合同的是谁。","b":"<p>面试你的公司和给你签合同的公司，不一定是同一家。有些岗位会被塞进劳务派遣或关联公司，工资、社保、晋升全归另一家管。签约主体必须和发工资、交社保的是同一个名字。名字对不上，先问清楚为什么。</p>"},{"n":3,"t":"试用期长短有上限，多谈的那一个月是白送的。","b":"<p>《劳动合同法》第 19 条写得明白：合同期 3 个月以上不满 1 年的，试用期最多 1 个月；1 年以上不满 3 年的，最多 2 个月；3 年以上或无固定期限的，最多 6 个月。合同签一年却给你定 3 个月试用期，就是超了。超出部分不算试用期，按正式工待遇算。这条很多人不知道，白白多熬了两个月低工资。</p>"},{"n":4,"t":"同一家公司只能试用你一次。","b":"<p>转岗、升职、换个部门，再让你\"试用期三个月\"——不合法。同一用人单位对同一劳动者只能约定一次试用期。碰到了可以直接指出来，不用不好意思。</p>"},{"n":5,"t":"试用期也要交社保。","b":"<p>\"转正之后再补缴\"是最常见的拖词。用工之日起 30 日内单位就该办社保登记（《社会保险法》第 58 条），跟转不转正没关系。对方说转正再交，你就让他在 offer 或备注里写清楚补缴时间和基数——肯写的多半是真打算交，不肯写的你要留个心眼。</p>"},{"n":6,"t":"满一个月没签合同，从第二个月起能要双倍工资。","b":"<p>《劳动合同法》第 82 条：用工之日起超过 1 个月不满 1 年没签书面合同的，每月支付 2 倍工资。很多人干了半年才想起来，这时候赶紧把考勤、工资流水、工作群记录攒好。注意各地对仲裁时效起算点口径不同，别拖，发现就问、就留证据。</p>"},{"n":7,"t":"\"自愿放弃社保\"承诺书，签了也白签。","b":"<p>这类约定违反法律强制性规定，无效。但别因为无效就随手签——真出了事，你得花力气证明当时是被要求的。不签，或者签的时候注明\"系单位要求\"，更省事。</p>"},{"n":8,"t":"口头承诺的，写进附件才算数。","b":"<p>\"年底肯定给你调\"\"绩效最低也有 20%\"——面试时说得再真诚，没落纸就等于零。谈的时候顺势说一句\"这个能写进 offer 备注吗\"，对方愿不愿意写，本身就是个信号。</p>"},{"n":9,"t":"加班费基数、绩效算法，别信\"公司有制度\"。","b":"<p>制度在哪、你签没收过签收页、算法写没写进合同，这三样决定你以后能不能算清账。入职时把员工手册签收页拍照，绩效方案要一份电子版。没有这些，年底算绩效全凭对方一张嘴。</p>"},{"n":10,"t":"试用期辞退，公司得说出理由。","b":"<p>不是\"觉得不合适\"三个字就完事。单位在试用期解除合同，要证明你不符合录用条件——而录用条件得事先明确告知过你。所以入职时那份录用条件说明、岗位要求，你手上也该有一份。没有它，公司说你\"不合适\"就是违法解除。</p>"},{"n":11,"t":"每一页都拍照留底。","b":"<p>合同、offer、员工手册签收页、录用条件说明、培训协议——签字前拍一遍，签完再拍一遍。拍照不费事，但要养成习惯。真到需要举证那天，你翻手机就能拿出来，比回忆强一百倍。</p>"},{"n":12,"t":"空白的地方别签。","b":"<p>工资栏空着、日期空着、合同份数空着，对方说\"回头统一填\"——别信。所有空白项当场填完，填不了的划掉。签在空白纸上，等于把内容交给别人写。</p>"},{"n":13,"t":"试用期发现不对劲，趁早走。","b":"<p>试用期辞职提前 3 天通知就行（《劳动合同法》第 37 条），正式员工要提前 30 天。这是你成本最低的退出窗口。发现加班离谱、承诺兑现不了、同事全在离职，别说服自己\"再忍忍\"，三个月后你想走就没这么容易了。</p>"},{"n":14,"t":"入职当天把账号记全。","b":"<p>工号、企业邮箱、考勤账号、OA 登录——这些是日后证明劳动关系最直接的证据。第一天就存到自己的备忘录里，别等到要仲裁才想起来账号早被注销了。</p>"},{"n":15,"t":"从第一天开始存工资条和工作痕迹。","b":"<p>工资条每月截图，考勤每月截图，工作安排、排班、项目群消息随手存。这事做起来无聊，但打工人最值钱的不是工资，是证据。存了不一定用，用到时没有就晚了。</p><p>---</p>"}]},{"n":3,"t":"不要贱卖时间：时薪、加班与调休","items":[{"n":1,"t":"加班前先算这笔活值不值。","b":"<p>时薪 × 加班小时数，就是这个晚上你\"挣\"的钱——如果这个数低于你请人代劳的成本，或者低到让你觉得不值得，就该考虑外包或者砍需求。不是所有加班都值得，有些只是因为没人说\"不\"。</p>"},{"n":2,"t":"三种加班费倍数不一样。","b":"<p>工作日延时加班 1.5 倍，休息日加班又不能安排补休的 2 倍，法定休假日加班 3 倍（《劳动法》第 44 条）。很多人只知道\"加班有加班费\"，不知道倍数不同，结果休息日被安排干活还以为\"调休就行了\"。法定节假日那几天，调休抵不了。</p>"},{"n":3,"t":"每月加班有上限。","b":"<p>《劳动法》第 41 条：一般每日不超过 1 小时，特殊原因不超过 3 小时，每月不超过 36 小时。超过就是违法。这不是让你去举报，是让你知道——当公司让你每月加 80 小时，它不是\"奋斗文化\"，是违规，你有权不认。</p>"},{"n":4,"t":"\"大小周\"要算清给没给钱。","b":"<p>一周单休一周双休，多出来的那天算加班还是义务劳动？看合同和制度。很多公司把大小周写进\"工作时间\"，工资不变——那本质上是降时薪。算一下：同样月薪，工时多了 10%，时薪就低了 10%。</p>"},{"n":5,"t":"下班后的消息，别秒回。","b":"<p>秒回一次，期待就建立一次（经验判断）。回可以，但不必五分钟内回。重要的事别人会打电话，不重要的晚一小时回也没人记得。把\"随时在线\"的习惯改掉，是在给自己留一条边界。</p>"},{"n":6,"t":"\"弹性工作\"要先问清核心时段。","b":"<p>弹性不等于没有边界。面试时问一句：每天有没有必须在线的时间段？没有的话，恭喜，你可能每天都在\"弹性\"状态——也就是随时待命。有核心时段的，其余时间才是真自由。</p>"},{"n":7,"t":"考勤记录每月截图。","b":"<p>加班有没有被记进去、调休有没有被清零，全靠这些记录。发薪日顺手截一次，存到固定文件夹。做这件事只要十秒，用到时能省十天。</p>"},{"n":8,"t":"996 不合法。","b":"<p>不是行业惯例就合理，不是大家都这样你就得这样。知道这一点不一定能改变什么，但至少你心里清楚：这不是你的问题。</p>"},{"n":9,"t":"午休被占用算不算工时，看约定。","b":"<p>有些公司午休算工作时间，有些不算。差别在哪？算的话，一天就少一小时\"免费\"占用。入职时把员工手册里这条看一眼，心里有数。</p>"},{"n":10,"t":"别主动揽干不完的活。","b":"<p>第一次答应的时候，别人记住的是\"你能干\"，不是\"你很累\"。长期透支的账，身体和情绪会一起跟你算。学会说\"我手上有 A 和 B，这个排到第几位\"，比默默接下强。</p>"},{"n":11,"t":"通勤时间别全交给短视频。","b":"<p>一天两小时通勤，一年 500 小时。用来听课、听书、构思工作，是投资；用来刷短视频，是消耗。同样两小时，几年下来差距很大。不是让你每分每秒都上进，是让你知道这段时间本来可以怎么用。</p>"},{"n":12,"t":"没议程的会，试着问一句。","b":"<p>\"这个会能文字同步吗？\"很多时候对方会说\"其实发群里也行\"。砍掉一个没必要的会，省下的不只是那一小时，还有被打断的整个下午。</p><p>---</p>"}]},{"n":4,"t":"不要少拿钱：工资、社保与个税","items":[{"n":1,"t":"工资到账当天就核对。","b":"<p>到手数和 offer 上写的对不上，当月就问财务，别攒到年底。越拖越说不清——是税扣多了、社保基数变了，还是绩效被砍了，时间一长全变成糊涂账。养成看工资条的习惯，每个月的数字你心里得有数。</p>"},{"n":2,"t":"社保基数应该是你上年度月平均工资。","b":"<p>不是公司随口定的数，也不是当地最低标准。每年 7 月前后各地会调整缴费基数上下限，公司若一直按最低档给你交，你当月到手可能多一点，但公积金贷款额度、养老金、生育津贴全都跟着缩水。查法：当地社保 App 或支付宝/微信的城市服务里能看到缴费基数。</p>"},{"n":3,"t":"个人扣的和单位交的是两笔钱。","b":"<p>五险一金从工资里扣的是你个人那份，单位那份由公司出。有的公司把单位那份也算进\"你的成本\"来压低工资，说法听着唬人，其实是两码事。看工资条时把个人扣款和单位缴纳分开算，才知道自己真实成本。</p>"},{"n":4,"t":"公积金别主动放弃。","b":"<p>单位和个人比例通常一致，各地在 5%–12% 之间，你有 12% 公司就配套 12%，等于每月多一笔强制储蓄。有人说\"到手少点，不如折现给我\"——别答应，这笔钱租房、买房、装修都能用，折现给你的那点远不够补。已经工作多年从没查过的，今天就去公积金 App 看一眼余额和缴存比例。</p>"},{"n":5,"t":"每月工资条截图，至少存两年。","b":"<p>用处有两个：一是算加班费、经济补偿时，工资基数靠它；二是换工作时谈薪，这是你最真实的底牌。存手机相册或云盘都行，按月建个文件夹，别等到仲裁时翻聊天记录。</p>"},{"n":6,"t":"年终奖、13 薪看合同，不看心情。","b":"<p>年终奖发不发、发多少，法律没有强制规定，全看合同或公司制度怎么写。写了\"按绩效发放\"的，公司有解释权；写了具体数额或计算方式的，就是你的钱。入职时把这一条问清楚、让对方指给你看制度原文，比听\"我们向来都发\"靠谱得多。这一条属于经验判断——具体以你签的文件为准。</p>"},{"n":7,"t":"加班费基数看合同约定，各地口径不一样。","b":"<p>按劳动合同约定的工资算，还是按实际到手算，各地规定不同。所以合同上那个\"基本工资\"写多少很关键——写太低，加班费跟着低。签字前看一眼这一栏，别让它成为以后的坑。具体算法以当地规定为准。</p>"},{"n":8,"t":"每年 3 月 1 日到 6 月 30 日，做一次个税年度汇算。","b":"<p>在\"个人所得税\"App 上点几下就行。预缴多了会退给你，少了要补。很多人从来不点，等于白白把钱留在税务局。第一次操作大概十分钟，之后每年两分钟。</p>"},{"n":9,"t":"专项附加扣除，该填的都填上。","b":"<p>七项：子女教育、继续教育、大病医疗、住房贷款利息、住房租金、赡养老人、3 岁以下婴幼儿照护。2023 年起，\"一老一小\"提了标准：子女教育、3 岁以下婴幼儿照护是每个孩子每月 2000 元，赡养老人是每月 3000 元（独生子女，非独生子女分摊）。每项标准不一样，App 里会提示。父母满 60 岁、你在租房或有房贷、自己在读研——这些都是实打实的抵扣。</p>"},{"n":10,"t":"住房租金和房贷利息只能选一个扣。","b":"<p>两条看着都符合，但同一个纳税年度不能同时享受。有房贷又租房的，选扣除额度高的那个。 spouses 各自的情况也要分开算，别重复填。</p>"},{"n":11,"t":"年中跳槽，汇算时多半能退一笔。","b":"<p>个税按累计预扣法算，新单位只按你在本单位任职的月份重新累计，不带原单位的数据，所以跳槽那年预扣容易偏多。到次年 3 到 6 月汇算时，按全年真实收入重算，多退少补——<strong>可能退，也可能要补</strong>，不是一定退。这也是每年要做汇算的原因。具体以 App 计算结果为准。</p>"},{"n":12,"t":"工资低于当地最低工资标准，可以直接投诉。","b":"<p>最低工资标准每年公布，当地人社局官网查得到。到手低于这个数，先确认是不是扣了社保前的口径，确认后就可以找劳动监察。不用怕，这是硬规定。</p>"},{"n":13,"t":"医保个人账户的钱能给家人用。","b":"<p>在国家医保服务平台 App 上办一次家庭共济绑定，个人账户的钱就能给家人用。范围已经扩到 8 类近亲属：配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、孙子女、外孙子女——不只是配偶父母子女。被共济人要是医保参保人。没办的等于让那笔钱一直躺着，具体开通情况看当地政策。</p>"},{"n":14,"t":"公积金不只用来买房。","b":"<p>2026 年 9 月 20 日起施行的新《住房公积金管理条例》把租房、装修自住住房、支付自住住房物业费都列为全国统一的提取情形——旧条例里没有后两项，这是新规。法律上能提，但具体条件、频次、额度由各设区市定细则，以当地规定为准。租房提取通常最容易，线上就能办。别让这笔钱躺在账户里贬值。</p>"},{"n":15,"t":"别为到手多几百块同意\"现金发薪不交社保\"。","b":"<p>看似每月多拿一点，实则丢了社保缴费年限、公积金、生育津贴、工伤保障，还有买房买车的资格。这笔账算不过来。真遇到公司这么提议，让他们把不交社保的理由写下来——肯写的罕见，写了你也有了证据。</p><p>---</p>"}]},{"n":5,"t":"不要被白嫖：加班费与劳动证据","items":[{"n":1,"t":"从第一天就存证据。","b":"<p>合同、offer、工资条、考勤、排班、聊天记录——这些不是防谁，是给自己留后路。真到需要举证那天，你翻手机就能拿出来，比回忆强一百倍。存证据不是敌意，是成年人的基本操作。</p>"},{"n":2,"t":"加班要有痕迹。","b":"<p>口头安排的加班，事后很难认。审批单、打卡记录、工作群消息，能留就留。领导在群里说\"今晚大家辛苦一下把这个赶出来\"，这就是证据。截图存好，别等清理群消息的时候才想起来。</p>"},{"n":3,"t":"看懂工资条上的项目名。","b":"<p>拆成\"基本工资 + 绩效 + 补贴\"的，加班费基数可能按基本工资算——而基本工资往往写得很低。签字时看一眼这一栏，别让它成为以后的坑。</p>"},{"n":4,"t":"\"自愿放弃加班费\"的文件，别签。","b":"<p>这类约定违反法律强制性规定，无效。但别因为无效就随手签——真出了事，你还得证明当时是被要求的。不签，或者签的时候注明\"系单位统一要求\"，更省事。</p>"},{"n":5,"t":"在家办公、线上待命也算工时。","b":"<p>领导晚上十点在工作群布置任务、要求半小时内回复，这不是\"弹性\"，是工作。聊天记录、任务内容、回复时间，都存下来。有些地方已经判过这类案件，认的是实际工作事实，不是你在不在工位。</p>"},{"n":6,"t":"法定节假日的加班，调休抵不了。","b":"<p>休息日加班可以安排补休，法定休假日不行——法定节假日加班必须付 3 倍工资。把这条记住，就不会被\"给你调休一天\"打发了。</p>"},{"n":7,"t":"离职交接时导出工作痕迹。","b":"<p>排班表、项目邮件、工作成果、考勤汇总——离职当天权限就没了。交接前把属于自己的、能证明劳动关系和工资水平的材料导出留存。别拿公司的商业秘密，这跟留证据是两回事。</p>"},{"n":8,"t":"劳动纠纷先协商。","b":"<p>协商不成，找劳动监察或申请仲裁。别一上来就仲裁，也别一上来就认栽。协商时把你的诉求和依据说清楚，很多问题到这一步就解决了。</p>"},{"n":9,"t":"仲裁时效是一年。","b":"<p>从你知道权利被侵害那天起算（《劳动争议调解仲裁法》第 27 条）。拖欠工资、没签合同、违法解除——越早处理越好。别信\"不着急，以后再说\"，一年过得比你以为的快。</p>"},{"n":10,"t":"仲裁不收费。","b":"<p>别被\"要先交钱\"\"找我们代理包赢\"的说法唬住。劳动争议申请仲裁不收费，材料自己准备就行。真需要帮助，当地法律援助中心可以问，免费的。</p>"},{"n":11,"t":"证据按时间线整理。","b":"<p>一堆散乱截图没人看得懂。按时间排个序：什么时候入职、什么时候开始加班、哪天欠薪、哪天被辞退，配上一句话说明。整理成一份文档，仲裁时能省很多事。</p><p>---</p>"}]},{"n":6,"t":"不要裸辞：离职的现金账","items":[{"n":1,"t":"先存够 3 到 6 个月生活费。","b":"<p>这是应急金，不是存款——专门用来在你没工作时维持生活。没有这笔钱就辞职，你会被迫接受下一个烂 offer，因为你等不起。有这笔钱，你才有说\"不\"的底气。</p>"},{"n":2,"t":"试用期提前 3 天，正式员工提前 30 天。","b":"<p>《劳动合同法》第 37 条。书面通知，微信或邮件都行，但要留下\"你通知过\"的证据。别口头说了就算，到时候对方说你自动离职，你连反驳的依据都没有。</p>"},{"n":3,"t":"别在情绪最差的那天提离职。","b":"<p>被骂了、被抢功了、加班到崩溃——那天提的辞职，第二天多半会后悔。给自己三天冷静期。三天后还想走，那就是真的想走。</p>"},{"n":4,"t":"下家 offer 到手再走。","b":"<p>除非你已经存够半年生活费、并且实在一天都待不下去，否则别裸辞。找工作期间的心态和在职期间完全不一样——在职时你是挑，离职后你是求。这个差别会直接影响你拿到什么价。</p>"},{"n":5,"t":"主动辞职一般没有经济补偿。","b":"<p>除非公司有过错：欠薪、不交社保、强迫劳动、违章指挥危及人身安全等。这些情况下你提出解除，可以主张经济补偿（《劳动合同法》第 38、46 条）。所以真遇到公司违规，别急着写\"个人原因辞职\"，那几个字可能值几个月工资。</p>"},{"n":6,"t":"交接清单写清楚，邮件确认。","b":"<p>交接了什么、还剩什么、哪些账号已移交——发一封邮件给领导和接手人，写明\"以上为我的全部交接内容\"。最后一个月的工资和离职证明，有时候就卡在\"交接不清\"这四个字上。</p>"},{"n":7,"t":"离职证明、工资单、社保记录全拿齐。","b":"<p>离职证明和社保缴纳记录，新单位入职要用；工资单和考勤，是以后算账的依据。走之前一次性要齐，别指望离职后再找 HR——那时的态度完全不一样。</p>"},{"n":8,"t":"导出属于自己的东西。","b":"<p>作品、项目文档、个人联系方式——不涉及公司机密的部分，交接前导出。别拿公司的客户名单和商业秘密，那是另一回事，代价很大。</p>"},{"n":9,"t":"别在离职时翻脸。","b":"<p>行业圈子小，背调会打电话。把情绪咽下去，客客气气走完流程。你失去的是一份工作，别再搭上前公司的评价。</p>"},{"n":10,"t":"社保别断。","b":"<p>离职后以灵活就业身份自己接着交，或者尽快入职新单位。灵活就业一般只能以个人身份参加职工养老和职工医疗两险，工伤、失业、生育交不了。社保断缴影响医保报销、购房购车资格，各地政策不同但都不好受。离开前问清楚社保转到哪、什么时候停，别让它无声无息地断掉。</p><p>---</p>"}]},{"n":7,"t":"不要乱跳槽：换工作的算法","items":[{"n":1,"t":"先问：现在的问题，换一家能解决吗？","b":"<p>如果是钱少，换工作大概率能解决。如果是\"领导难搞\"\"团队内耗\"\"行业没前途\"——换一家可能重演。先把问题想清楚，别把跳槽当万能药。</p>"},{"n":2,"t":"四项打分，不只看月薪。","b":"<p>到手工资、社保公积金、通勤成本、成长空间，每项打分再加权。月薪高 3000 但通勤多一小时、公积金按最低交，实际可能更差。把数字摆出来，感觉靠不住。</p>"},{"n":3,"t":"一年一跳会伤履历。","b":"<p>除非每次都有明确跃迁——职级升了、薪资涨了 30% 以上、平台明显变好（经验判断）。否则 HR 看你简历时会想：这人是不是待不住？这个印象一旦形成，后面很难解释。</p>"},{"n":4,"t":"背调会核入职时间和离职原因。","b":"<p>简历上的时间别注水，多写的一个月会被查出来。离职原因写\"个人发展\"，别说前公司坏话——背调电话打到前公司，你说过的话会传回来。</p>"},{"n":5,"t":"谈薪先让对方出数。","b":"<p>问你期望薪资时，说\"我希望在合理范围内，想先了解贵司这个岗位的预算\"——让对方先报价。你先说出口的那个数，就是天花板。真要给范围，给一个比心理预期高一点的上限。</p>"},{"n":6,"t":"竞业限制先看有没有补偿。","b":"<p>签了竞业协议，但公司没按月给经济补偿——这类条款的效力存疑。别被\"你签了就不能去同行\"吓住，先看协议、看补偿、看限制范围。拿不准的，找当地劳动监察或律师问一次。</p>"},{"n":7,"t":"新公司不合适也要趁早走。","b":"<p>跳槽不是终点。入职后发现承诺兑现不了、加班离谱，试用期就是你的退出窗口——提前 3 天通知就行。别因为\"刚跳过来又走太难看\"硬撑。</p>"},{"n":8,"t":"别为期权放弃现金。","b":"<p>期权值多少钱，取决于公司能不能上市、你手里有多少股、行权价是多少。这些问题你答不上来，就说明它对你现在不值钱。先用现金把自己养活，再谈梦想。</p>"},{"n":9,"t":"涨薪 30% 以内最稳。","b":"<p>涨幅太大，对方会怀疑你之前虚报薪资，或者这个岗位有坑等着你（经验判断）。当然，真正的能力跃迁不在此列——如果你确实值这个价，拿不到才是问题。</p>"},{"n":10,"t":"每次换工作都更新简历存盘。","b":"<p>别等要找工作才写简历——那时候你会忘记两年前那个项目的细节。每换一次工作、每完成一个大项目，更新一次。积累下来的这份文档，迟早用得上。</p><p>---</p>"}]},{"n":8,"t":"不要被画饼：加薪、晋升与绩效","items":[{"n":1,"t":"加薪靠谈，不靠等。","b":"<p>没有人会因为\"你很努力\"主动给你涨工资。谈之前准备两样东西：市场价（同岗位同城市拿到多少）、自己的产出数据（做了什么、带来什么结果）。拿着这两样去谈，比\"我觉得我值\"有用一百倍。</p>"},{"n":2,"t":"\"明年会考虑你\"不是承诺。","b":"<p>让它写进绩效面谈记录——邮件、系统里的评语、面谈纪要都行。写不进去的，就是一句话。下次谈的时候你可以说\"上次您说今年会考虑，我们看看现在的进度\"，有记录的和没记录的效果完全不同。</p>"},{"n":3,"t":"绩效出来当场问扣分依据。","b":"<p>别憋到年底、别回家生闷气。评分出来那一刻就问：\"这项目标我哪里没达到？按什么标准扣的？\"问清楚，你才知道下个周期该往哪使劲——也才知道这个评分是不是在为你离职做铺垫。</p>"},{"n":4,"t":"记一份\"业绩台账\"。","b":"<p>完成的项目、数据、客户反馈、领导表扬的邮件——随手存到一个文档里。谈薪、晋升、跳槽写简历时，直接拿出来。没有这份台账，你会发现自己干了三年却说不出干了什么。</p>"},{"n":5,"t":"晋升看坑位，不只是能力。","b":"<p>你够格，但上面没人走，就没位置。所以晋升这事要问：什么时候有坑？我排第几？需要满足什么条件？把模糊的\"好好干\"变成具体的答案，你才知道该争取还是该准备换一家。</p>"},{"n":6,"t":"别把管理岗当唯一出路。","b":"<p>带团队不一定是涨薪最快的路。技术专家、资深工程师的钱未必更少，还少了很多协调的累。看清自己的长处在哪，别被\"不当管理就是没发展\"这话带偏。</p>"},{"n":7,"t":"领导说\"把你当自己人\"时，看资源。","b":"<p>给了你核心项目、给了你曝光机会、给了你实际好处——那是真的。什么都没给，只在深夜跟你谈心、让你多担待——那是话术（经验判断）。看行动，别听表态。</p>"},{"n":8,"t":"分清反馈和否定。","b":"<p>\"这个方案数据不对，改一下\"是反馈；\"你这个人就是不细心\"是否定。前者对事，后者对人。被 PUA 的时候先把这两类分开——前者该改，后者该挡回去。</p>"},{"n":9,"t":"PIP 要书面确认目标和期限。","b":"<p>绩效改进计划（PIP）有时是帮助，有时是辞退前的铺垫。签字前看清：目标是否合理、期限多长、达不到会怎样。别口头认领，所有条款落在纸上。</p>"},{"n":10,"t":"加薪没谈成，问\"什么条件下可以谈\"。","b":"<p>把对话从\"给不给\"转成\"怎么才能给\"。领导说\"下个季度再看\"，你就追问：具体看什么指标？到什么数就可以谈？得到一个具体答案，下次你就有依据来要钱。</p><p>---</p>"}]},{"n":9,"t":"不要硬扛：职场关系与内耗","items":[{"n":1,"t":"把同事当\"按规则协作的人\"。","b":"<p>不是朋友，也不是敌人——朋友会让你不好意思拒绝，敌人会让你把工作当战场。当成\"按规则一起把活干完的人\"，反而最省心：该配合的配合，该留痕的留痕，该说清的说清。很多职场痛苦，来自把关系想得太复杂。</p>"},{"n":2,"t":"生气时先离场。","b":"<p>话赶话的时候说出口的那句，你迟早会后悔。找个理由走开——去接水、去趟洗手间——给自己十分钟。把对方当天气，不是敌人：天气不好你躲一下就过去了，没必要跟它讲道理。</p>"},{"n":3,"t":"被当众批评，先记事实，别当场争。","b":"<p>当众吵赢了，你输的是在场所有人对你的印象。先把批评里的具体事实记下来，会后一对一说：\"您说的第三点，我想确认一下具体情况。\"当场争对错，只会让事情从\"工作问题\"变成\"态度问题\"。</p>"},{"n":4,"t":"消息别秒回，重要事用文字。","b":"<p>秒回会让你显得随时在线——这是你自己的选择，但要知道代价。真正重要的事，对方会打电话；不重要的，晚回一小时没人记得。涉及承诺、任务、数字的沟通，尽量用文字，留个记录。</p>"},{"n":5,"t":"学会拒绝，说\"我手上有 A 和 B\"。","b":"<p>直接说不，容易得罪人；默默接下，累的是自己。试试：\"我手上有 A 和 B，都挺急，您说这个排第几位？\"把选择权交回去——多数时候对方会自己权衡，或者干脆不提了。</p>"},{"n":6,"t":"别在茶水间和群里谈人、谈私事。","b":"<p>你说的话会传，而且会变形。不是让你活得小心翼翼，是让你知道：职场里没有\"悄悄话\"，只有\"暂时还没传开的话\"。</p>"},{"n":7,"t":"觉得\"所有人都看见我出丑了\"，除以二。","b":"<p>人天然会高估别人对自己的关注（经验判断）。你以为全场都在看，其实大部分人在想自己中午吃什么。这不是安慰，是让你把这件事的重量放对位置——该尴尬三秒，别尴尬三天。</p>"},{"n":8,"t":"深夜不做重大决定。","b":"<p>夜里人的判断会往悲观那边偏。那时的\"我要辞职\"\"我要摊牌\"，第二天早上多半会缓一缓。想发的重要消息，存草稿，明早再看一遍。</p>"},{"n":9,"t":"反复回想同一件糟心事时，换个动手的活。","b":"<p>脑子停不下来的时候，靠\"别想了\"是没用的。去洗碗、去整理桌面、去做需要动手的事——把注意力从情绪拉回动作。这比躺着反刍强得多。</p>"},{"n":10,"t":"情绪连着两周低落、影响睡眠和吃饭，去找专业帮助。","b":"<p>不是矫情，是身体在报警。长期情绪问题有成熟的干预方法，别硬扛，也别指望\"想开点\"。找心理咨询师或去医院心理科，跟感冒去看医生一个道理。</p>"},{"n":11,"t":"减少消耗你的人际往来。","b":"<p>有的人见完你电量满格，有的人见完你电量见底。后者不必绝交，但可以有意识地少见。把精力留给能产出、能让你舒服的人和事——这是你自己的资源，别随意挥霍。</p><p>---</p>"}]},{"n":10,"t":"不要白耗通勤：住处与时间","items":[{"n":1,"t":"租房时把通勤时长放前面。","b":"<p>单程少 30 分钟，一天来回就是 1 小时，一年按 220 个工作日算就是 220 小时——差不多九整天。房租贵几百块换这九天，多数时候划算。很多人算房租算得仔细，算时间却从来不算。</p>"},{"n":2,"t":"把房租差和交通费一起算。","b":"<p>住远一点房租省 1000，但每天通勤多 1 小时、交通费多 300。算总账可能只省 700，却搭进去 220 小时。把钱和时间放在一张表上比，结论会不一样。</p>"},{"n":3,"t":"能住近就住近。","b":"<p>在你负担得起的范围内，离公司近一点。时间比租金贵——尤其当你还年轻、还想学点东西的时候（经验判断）。每天多出的那一小时，几年下来能改变很多事。</p>"},{"n":4,"t":"通勤时间别全交给短视频。","b":"<p>用来听课、听书、构思工作、甚至只是想想今天要做什么，都是投资。不是要求你每分每秒上进——刷短视频放松也行——但至少知道这段时间本来可以怎么用。选择权在你手里，别让它默认被消耗掉。</p>"},{"n":5,"t":"远程/混合办公先问清考核方式。","b":"<p>在家办公不等于轻松，很多公司改用\"在线时长\"\"响应速度\"考核，反而更累。入职前问清楚：怎么算工时？多久要在线？成果怎么衡量？答不上来的，八成是\"随时待命\"。</p>"},{"n":6,"t":"每天固定起床时间，周末也一样。","b":"<p>生物钟稳定比睡够时长更管用。周末补觉到中午，周一反而更难受。固定时间起床，让身体形成惯性——这条听起来简单，做到的人不多，效果却很实在。</p>"},{"n":7,"t":"午睡控制在半小时内。","b":"<p>超过半小时进入深睡，醒来更迷糊。下午困了就睡 10 到 20 分钟，设个闹钟。如果非得睡一两个小时才撑得住，那不是午睡的问题，是晚上没睡够或者身体出了问题。</p>"},{"n":8,"t":"把加班打车报销当福利，要想清楚。","b":"<p>公司报销你加班到十点的打车费，看着是福利，其实是用钱换你的晚上和身体。这笔账不是不能算——偶尔加班没问题——但别把它当成\"公司对我好\"的证据。</p><p>---</p>"}]},{"n":11,"t":"不要乱花钱：打工人的钱袋子","items":[{"n":1,"t":"关掉所有用不上的自动续费。","b":"<p>现在就去手机支付设置里看一眼：视频会员、云盘、健身 App、各种\"连续包月\"。你会发现至少有那么两三样，你已经半年没用过却一直在扣钱。改成到期手动续，一年能省出好几顿饭。</p>"},{"n":2,"t":"先存 3 到 6 个月生活费。","b":"<p>这笔钱叫应急金，放随时能取的地方——货币基金、活期都行，别拿去投资。它的作用不是赚钱，是让你在被裁、生病、离职的时候不至于慌。没有这笔钱的人，做决定永远被动。</p>"},{"n":3,"t":"不买彩票，看到\"保本高收益\"直接走开。","b":"<p>承诺高收益又保本的东西，要么在骗你，要么在赌命。真有稳赚的机会，轮不到熟人朋友圈轮到你。这条没有例外。</p>"},{"n":4,"t":"不用最低还款，不轻易分期。","b":"<p>信用卡最低还款的年化利率高得吓人，分期手续费换算成年化也不低。非借不可时，先把费率换成年化利率再比——数字一摆出来，多数人就不想借了。</p>"},{"n":5,"t":"大额非必需购买设 24 小时冷静期。","b":"<p>看上的东西先加购物车，第二天再看。大部分冲动消费熬不过一晚上。网购善用七日无理由退货，收到不满意就退，别不好意思——这是你的权利。</p>"},{"n":6,"t":"不为\"划线价\"和大促囤货。","b":"<p>先涨价再打折、凑单满减、限量秒杀——套路就那些。买之前问一句：这东西没有促销我会买吗？答案是不会，那就是被促销牵着走了。</p>"},{"n":7,"t":"健身房按次付费。","b":"<p>除非你有一年以上的稳定健身记录，否则别办年卡。办卡的人多，坚持下来的人少——健身房就是在赌你不去。按次付费、短周期付费，损失可控。</p>"},{"n":8,"t":"长期闲钱可以选低费率的宽基指数基金。","b":"<p>不频繁交易、不加杠杆、不借钱投资，只拿\"扛得住损失\"的钱。同类基金优先选费率低的——费率差一点点，长期复利下差距很大。这条是通行做法，不构成投资建议，具体决策自己拿。</p>"},{"n":9,"t":"只给扛不住的损失买保险。","b":"<p>扛得住的小损失用应急金兜着，扛不住的——比如重病、身故——才用保险转移。保险优先买消费型，把\"返还\"\"分红\"当成不保证的部分。别把保险当理财。</p>"},{"n":10,"t":"家里有人靠你的收入过日子，先给自己买定期寿险。","b":"<p>不是先给孩子买。道理很简单：挣钱的人倒下，整个家庭的现金流就断了。定期寿险便宜、保额高，先把这个缺口补上。这条属于经验判断，具体保额按家庭开支算。</p>"},{"n":11,"t":"虚拟货币别碰。","b":"<p>比特币、泰达币这类，交易不受法律保护，亏了打官司也要不回来。别人拉你一起投，更要警惕——他图的是你的本金。</p>"},{"n":12,"t":"手串、玉石、名表按\"花掉的钱\"算账。","b":"<p>买了就是消费，不是储蓄。别在心里把它记成\"资产\"，那会让你在下次冲动消费时更容易说服自己。喜欢就买，但承认它是花钱。</p><p>---</p>"}]},{"n":12,"t":"不要踩红线：劳动维权与法律","items":[{"n":1,"t":"欠薪、不交社保、违法解除，先协商。","b":"<p>把诉求和依据列清楚，书面提出——微信、邮件都行。很多问题到这一步就解决了，没必要一上来就撕破脸。协商不成，再找劳动监察或仲裁。</p>"},{"n":2,"t":"仲裁时效一年。","b":"<p>从你知道权利被侵害那天起算（《劳动争议调解仲裁法》第 27 条）。在职时不好动手，离职后一拖就是两年——过期就没了。真遇到事，哪怕暂时不仲裁，也先把证据和时效记在日历上。</p>"},{"n":3,"t":"仲裁不收费，别找\"包赢代理\"。","b":"<p>劳动争议申请仲裁不收费。那些要你先交钱、承诺\"包赢\"的中介，要么骗钱，要么把你的案子做成流水线。真需要帮助，去当地法律援助中心问，那是不收费的。</p>"},{"n":4,"t":"别签\"自愿放弃社保\"\"放弃加班费\"的文件。","b":"<p>这类约定违反法律强制性规定，无效。但别因为无效就随手签——留下\"我是被要求的\"的证据，比事后争论省事。</p>"},{"n":5,"t":"让你做假数据、虚假报销，拒绝并留痕。","b":"<p>\"大家都这么做\"不是理由。出了事，责任不会因为你职位低就消失。拒绝的时候留个文字记录——领导在群里@你、你在群里回复\"这个数据我不太确定是否合规\"，将来能保护你。</p>"},{"n":6,"t":"别用公司设备干私事，别把公司资料带去做副业。","b":"<p>公司的电脑、邮箱、内网，都是公司的。用它们干私活，轻则违反制度，重则涉及侵权。副业再想做，也别碰公司的资源和数据——这条线很硬。</p>"},{"n":7,"t":"工伤立刻就医并报告。","b":"<p>保留诊断证明、现场照片、目击者信息。别想着\"休息一下就好\"——工伤认定有时限，证据过期就没了。上下班途中，非本人主要责任的交通事故也算工伤（《工伤保险条例》第 14 条）。</p>"},{"n":8,"t":"经济补偿按工作年限算。","b":"<p>每满 1 年给 1 个月工资；6 个月以上不满 1 年按 1 年算；不满 6 个月给半个月（《劳动合同法》第 47 条）。先自己算清楚这个数，再谈——别被\"公司规定给一个月\"糊弄过去。</p>"},{"n":9,"t":"违法解除的赔偿金是经济补偿的 2 倍。","b":"<p>《劳动合同法》第 87 条。公司没理由就让你走、走的程序不对，都可能构成违法解除。这跟\"协商解除\"是完全不同的两笔钱，别签错字。</p>"},{"n":10,"t":"别信\"代理维权\"包赢。","b":"<p>自己的证据自己整理，最靠谱。劳动纠纷本来就不复杂：合同、工资条、考勤、沟通记录，按时间线摆清楚。真要找人，找正规律师或法律援助，别信朋友圈广告。</p><p>---</p>"}]},{"n":13,"t":"不要失信：简历、背调与职业信用","items":[{"n":1,"t":"简历上的时间、职位、薪资别编。","b":"<p>背调会核，特别是入职时间和离职原因。多写的一个月、虚构的一段经历，查出来就是诚信问题——丢掉的不只是这一个 offer。真实简历哪怕没那么漂亮，也比被拆穿强。</p>"},{"n":2,"t":"离职原因写\"个人发展\"。","b":"<p>别说前公司坏话。背调电话会打到前公司，你说过的话会传回来。把离职原因说得中性、简短，不给对方发挥的空间。</p>"},{"n":3,"t":"项目数据要能说出细节。","b":"<p>简历写\"负责项目，GMV 增长 200%\"，面试官一定会追问：基数多少？你具体做了什么？哪个环节是你推动的？答不上来的，比不写还糟。只写你能讲清楚的数字。</p>"},{"n":4,"t":"别把团队成果写成个人成果。","b":"<p>面试官见得多了，一问就穿。\"我们团队做了什么，我在其中负责哪一块\"——这样说既真实，又说明你懂协作。抢功的简历，反而暴露格局。</p>"},{"n":5,"t":"每份工作留一份可证明的成果清单。","b":"<p>项目名、时间、你的角色、可量化的结果、能证明的材料（邮件、截图、文档）。在职时随手记，离职后写简历直接拿来用。别等三年后回忆，那时候只剩\"我好像做过一个项目\"。</p>"},{"n":6,"t":"背调授权书别乱签。","b":"<p>授权范围、查询内容、有效期，看清楚再签。不是所有背调都要查工资流水和征信——超出范围的要求，可以拒绝。签字前拍照留底。</p>"},{"n":7,"t":"职业资格、学历证书别买。","b":"<p>学信网、职业资格查询系统都查得到。花钱买的假证，用一次毁一次信用。真想提升，去考一个真的，慢一点但踏实。</p>"},{"n":8,"t":"在职接私活先看合同。","b":"<p>很多劳动合同里有禁止兼职的条款，违反可能被解雇。真要做副业，先把合同翻出来看清楚——不是让你偷偷做，是让你别在不知情的情况下踩线。</p><p>---</p>"}]},{"n":14,"t":"不要透支身体：职业健康与体检","items":[{"n":1,"t":"久坐每小时起来动一动。","b":"<p>不用专门去健身房，每小时站起来走两分钟、伸展一下，就有用。比周末猛练两小时更划算——身体怕的是\"一直不动\"，不是\"动得不够狠\"。设个闹钟提醒自己。</p>"},{"n":2,"t":"每晚睡 7 小时左右，作息固定。","b":"<p>不是\"有空就补觉\"，是每天差不多时间睡、差不多时间起。睡眠债不是周末能一次还清的。长期睡不够，判断力、情绪、免疫力一起下降——这笔账最容易被忽略。</p>"},{"n":3,"t":"下午两点以后不碰咖啡因。","b":"<p>咖啡因代谢需要几个小时，下午喝的到晚上还在起作用——你以为自己入睡没问题，其实深睡被压缩了。想下午提神，改成短暂散步或十分钟小睡。</p>"},{"n":4,"t":"体检按年龄性别做有证据的项目。","b":"<p>别迷信\"全身全套\"\"肿瘤标志物套餐\"——很多项目查不出问题，却带来一堆假阳性和焦虑。按年龄、性别、家族史做该做的筛查，具体项目问医生，比自己网购套餐靠谱。</p>"},{"n":5,"t":"颈椎腰椎出问题，先去正规医院。","b":"<p>别只靠按摩、贴膏药扛着。持续的疼痛要先明确诊断，再决定怎么治。按摩店治不了结构性损伤，拖久了更难恢复。</p>"},{"n":6,"t":"压力大时先做性价比最高的几件事。","b":"<p>动起来、多见光、按时睡、找人说说——这四件事不花钱、见效快，比什么鸡汤都实在。情绪低落的时候，先别想\"为什么我这样\"，先把这几件做了。</p>"},{"n":7,"t":"连续失眠、情绪低落两周以上，去找专业帮助。","b":"<p>两周是一个信号。不是\"想开点\"就能解决的——持续的低落和失眠可能是需要干预的状态。去医院心理科或找心理咨询师，跟感冒去看医生一样正常。</p>"},{"n":8,"t":"把年假休完。","b":"<p>钱买不回恢复的时间。攒着年假不休，不会变成奖金，只会变成\"离职时折算的那点钱\"。真正需要休息的是现在，不是以后。</p>"},{"n":9,"t":"加班多的人更要定期查血压、血糖、血脂。","b":"<p>长期熬夜、久坐、压力大，这三样是慢性病的好朋友。别等出事才查。35 岁以后尤其注意，每年一次基础检查，花不了多少时间。</p>"},{"n":10,"t":"别靠熬夜换\"高效\"。","b":"<p>晚上那两小时看起来多干了活，其实是在透支第二天的判断力和状态。算总账，多数时候是亏的。偶尔熬夜没办法，长期熬夜是把身体当耗材——这份工作不值得。</p><p>---</p>"}]},{"n":15,"t":"不要单腿站立：副业与抗风险","items":[{"n":1,"t":"先把主业做稳，再谈副业。","b":"<p>主业不稳的时候做副业，多半是焦虑驱动的——买课、囤货、盲目开号，钱花了，方向没找到。先把主业做扎实，保证每个月有稳定现金流，再用余力去试。副业是锦上添花，不是救命稻草，顺序反了容易两头空。</p>"},{"n":2,"t":"优先选能复用主业技能的。","b":"<p>你是做设计的，接设计单；你是写代码的，接开发活——起点低、上手快、单价高。从零开始学一个全新领域，先别谈收入，光是爬坡期就够耗掉你的热情。用已有的本事赚钱，是最短的路径。</p>"},{"n":3,"t":"别投钱加盟、囤货、买课。","b":"<p>任何要你先掏钱\"才有资格赚钱\"的副业，都先打个问号。加盟费、囤货、高价培训——这些模式的共同点是：赚的是你的本金，不是你的劳动。真想验证一个副业能不能赚钱，先想办法卖出第一单，哪怕只赚十块。有人愿意付钱，说明这事成立。</p>"},{"n":4,"t":"副业收入没超过主业 30% 之前，别辞职。","b":"<p>这条是硬线（经验判断）。副业稳定超过主业三成、并且连续几个月如此，才值得认真考虑。在此之前，它只是收入补充，不是替代。很多人副业刚有起色就辞职，结果把刚跑通的路也搞断了。</p>"},{"n":5,"t":"用下班后固定的一到两小时。","b":"<p>副业最怕的是占用全部时间——熬到凌晨、周末全搭进去，主业受影响，身体也垮。给自己划个固定时段，比如每天 8 点到 10 点，雷打不动。这段时间能做出东西就做，做不出来就调整方向，别靠堆时间感动自己。</p>"},{"n":6,"t":"接私活先看劳动合同。","b":"<p>很多合同禁止兼职，或者要求竞业。别在不知情的情况下违约——真被抓住，可能连主业都丢。翻出合同看清楚，有疑问就问清楚，再决定怎么接。</p>"},{"n":7,"t":"副业收入记得申报纳税。","b":"<p>劳务报酬、经营所得都有对应的纳税义务。金额小的时候可能感觉不到，但别养成隐瞒的习惯——因小失大不值得。具体怎么申报，问当地税务或看自然人电子税务局，比自己猜靠谱。</p>"},{"n":8,"t":"把技能存到能变现的程度。","b":"<p>证书、作品、案例——三样至少有两样。光说\"我会\"，没人信；拿出一个作品、一个案例、一张证书，别人才能判断你值多少钱。这些东西要在平时就积累，等要用时再准备就来不及了。</p><p>---</p>"}]},{"n":16,"t":"不要被打懵：裁员与失业应对","items":[{"n":1,"t":"听到风声先动手。","b":"<p>公司开始冻结招聘、缩短工时、要求汇报细化——这些都是信号。别等正式通知，先更新简历、备份作品、整理人脉。做准备不等于背叛，是给自己留退路。真到那天，你不会后悔提前准备过。</p>"},{"n":2,"t":"裁员补偿按工作年限算。","b":"<p>每满 1 年给 1 个月工资，不满 6 个月给半个月（《劳动合同法》第 47 条）。公司开口说\"补偿你一个月\"的时候，你心里要有数：该拿多少，先自己算清楚。这不影响谈判的姿态，但影响你的底线。</p>"},{"n":3,"t":"别被\"自愿离职\"的话术带跑。","b":"<p>公司说\"你自己提离职，我们给你写好评、帮你背调\"——听着是照顾你，实际上是省掉补偿。主动辞职一般没有经济补偿，这中间的差价可能是几个月工资。签字前想清楚，必要时问一句：\"这算协商解除还是我个人原因？\"</p>"},{"n":4,"t":"签字前看清文件的性质。","b":"<p>\"协商解除协议\"\"解除劳动合同通知书\"\"辞职申请\"——名字不同，法律后果完全不同。别在没看清的情况下签字，也别签空白的。看不懂就带回去看，没人能逼你当场签。</p>"},{"n":5,"t":"被裁后先去领失业保险金。","b":"<p>符合条件的别漏——这是你交了多年社保换来的。离职原因、缴费年限、登记要求各地不同，去当地人社部门或 App 上查一次，办起来不难。这笔钱不多，但能在最慌的时候托一下底。</p>"},{"n":6,"t":"社保自己接着交。","b":"<p>离职后以灵活就业身份继续交（个人一般只能交职工养老和职工医疗两险），或尽快入职新单位。社保断缴影响医保报销、购房购车资格，各地政策不同但都不好受。走之前问清楚什么时候停、怎么接着交，别让它无声无息断掉。</p>"},{"n":7,"t":"失业期给自己定个求职节奏。","b":"<p>每天投几份、约几次面谈、更新几次简历——写下来，按节奏走。失业最容易陷入的是\"整天刷招聘软件却什么都没做\"，那种无力感比没工作本身更折磨。用具体的动作把自己拉出来。</p>"},{"n":8,"t":"别在失业时做大额消费和重大决定。","b":"<p>心态不稳的时候，人容易做出平时不会做的事——买个贵的东西安慰自己，或者仓促接受一个明显不合适的工作。给自己设个规则：失业期间不做超过一定金额的决定，也不急着签任何长期承诺。</p>"},{"n":9,"t":"把这段时间用来补技能。","b":"<p>简历投出去等回音的空档，别全用来刷剧。学一个跟下一个工作相关的技能、补一个证书、做一个小项目——这些在面试时都能说。时间空出来了，怎么用决定你下一份工作的起点。</p><p>---</p>"}]},{"n":17,"t":"不要乱签字：竞业、保密与离职文件","items":[{"n":1,"t":"竞业限制不是谁都适用。","b":"<p>法律限定在高级管理人员、高级技术人员和其他负有保密义务的人员（《劳动合同法》第 24 条）。普通岗位被要求签竞业，先问一句：我属于哪一类？范围多大？别被\"公司统一签\"糊弄过去——签了之后限制的是你下一份工作。</p>"},{"n":2,"t":"竞业期限最长两年，期间要有补偿。","b":"<p>《劳动合同法》第 24 条：竞业限制期限不得超过 2 年；单位在限制期内按月给予经济补偿，是第 23 条的规定。只限制你、不给补偿的，效力存疑。碰到了别自己吓自己，先看协议、看补偿记录，拿不准找劳动监察或律师问一次。</p>"},{"n":3,"t":"保密协议可以签，但不能限制换工作。","b":"<p>保密是保护公司的商业秘密，不等于\"你不能去同行\"。如果一份保密协议写着\"离职后不得从事相关行业\"，那实质是竞业，得按竞业的规矩来——包括给补偿。分不清就问，别稀里糊涂签。</p>"},{"n":4,"t":"\"个人原因辞职\"和\"协商解除\"要分清。","b":"<p>前者通常没有经济补偿，后者可以有。公司让你写\"个人原因\"的时候，多问一句为什么。这几个字可能值几个月工资，别随手就写。</p>"},{"n":5,"t":"空白的离职单、交接单别签。","b":"<p>对方说\"回头统一填\"——别信。所有空白处当场填完，填不了的划掉。签在空白纸上，等于把内容交给别人写，写什么你都得认。</p>"},{"n":6,"t":"每一页都拍照留底。","b":"<p>竞业协议、保密协议、离职证明、交接单——签字前拍一遍，签完再拍一遍。这份习惯在合同那节说过，这里再说一次，因为离职时的文件比入职时更关键。</p>"},{"n":7,"t":"服务期和违约金，只对专项培训有效。","b":"<p>公司出钱给你做了专项培训，约定服务期，你提前走才可能要付违约金——而且违约金不能超过未履行服务期分摊的培训费用（《劳动合同法》第 22 条）。普通的入职培训不算。别被\"你签了服务期就要赔十万\"吓住，先看有没有真金白银的培训投入。</p>"},{"n":8,"t":"离职证明上别写对自己不利的描述。","b":"<p>\"因严重违纪解除\"\"工作表现不佳\"这类表述，会影响你下一份工作。发现有问题，当场提出修改——这是你的权利。谈不下来，至少留个证据，必要时可以主张。</p><p>---</p>"}]},{"n":18,"t":"不要当冤大头：合法薅羊毛的分寸","items":[{"n":1,"t":"该休的假全休掉。","b":"<p>年假、调休、病假——这是制度给你的，不是老板的恩赐。攒着不休不会变成奖金，离职时折算的那点钱也远不如真正休息一阵。别被\"太忙了没空休\"骗了，忙的人更需要休息。</p>"},{"n":2,"t":"公司出的培训、体检、团建福利，用满。","b":"<p>这些是明面上的福利，不用白不用。培训能学东西，体检能查问题，团建能认人——把每一项的性价比用足，是你应得的回报的一部分。</p>"},{"n":3,"t":"通勤补贴、餐补、话补，按制度报。","b":"<p>该报就报，别觉得\"几十块钱算了\"。这不是占便宜，是制度给你的钱。你每个月少报一点，一年下来就是几千块——这笔账不复杂。</p>"},{"n":4,"t":"报销票据留好，别垫钱忘了报。","b":"<p>垫出去的钱一定要在当月或规定期限内报掉，拖久了票据丢、流程变、经办人换，最后只能自己吃哑巴亏。手机里建个\"待报销\"相册，随手拍票据。</p>"},{"n":5,"t":"公积金、医保家庭共济、个税扣除，都是明面上的钱。","b":"<p>这几项在工资那节讲过，这里再提醒一次：它们不需要你\"争取\"，只需要你\"去办\"。花一个下午办完，往后每年都在省钱。不办就是让钱躺在别人账上。</p>"},{"n":6,"t":"摸鱼要有度。","b":"<p>完成分内事、不耽误协作、不被抓典型——在这个前提下，偶尔放松一下没什么（经验判断）。但要清楚：摸鱼的代价是拿工作质量和职业信用冒险。这不是教你怎么偷懒，是让你别把自己逼成永动机，也别把边界踩过头。</p>"},{"n":7,"t":"别用公司设备干私活，别把公司资料带走。","b":"<p>这条是底线。用公司的电脑、邮箱、内网做副业，或者把客户名单、代码、方案带走——这不是\"薅羊毛\"，是侵占和侵权。省钱省时间可以，碰这些就是给自己挖坑。</p>"},{"n":8,"t":"虚假报销、伪造病假条、代打卡，不做。","b":"<p>这些属于造假，后果比省下的钱大得多——轻则处分、重则辞退，还会留下信用污点。所谓\"大家都这么干\"，出事的时候没一个人会替你担。这条没有商量余地。</p>"},{"n":9,"t":"薅羊毛的底线一句话。","b":"<p>拿的是制度给的钱，不是骗来的钱。分清楚这一点，你就不会越界。</p><p>---</p>"}]},{"n":19,"t":"不要内耗：情绪与精力管理","items":[{"n":1,"t":"把\"打算做\"写成具体动作。","b":"<p>\"下周开始健身\"等于没说。写成\"周二晚上 7 点，在家，跟着那个视频做 20 分钟\"——时间、地点、遇到什么就做什么，全写清楚。模糊的计划消耗意志力，具体的计划只需要执行。</p>"},{"n":2,"t":"一次只做一件事。","b":"<p>边开会边回消息，你以为高效，其实两件事都没做好。大脑切换任务有成本，频繁切换会让注意力碎掉。试试一次只干一件——你会发现做得更快，也更不容易累。</p>"},{"n":3,"t":"做深度工作时挡住打断。","b":"<p>哪怕几秒钟的打断，也会把你从思考状态里拽出来。需要连续思考的活，找个安静地方、戴上耳塞、把消息关掉。保护注意力，比多干两小时有用。</p>"},{"n":4,"t":"消息改成每天固定几次批量处理。","b":"<p>不要来一条看一条。把邮件和消息设成每天上午、下午各集中处理一次——例外情况留个电话。你会发现，绝大多数\"急事\"其实不急，只是被打断的感觉很像紧急。</p>"},{"n":5,"t":"开工前写下退出条件。","b":"<p>一件事做到什么程度就停、什么信号出现就放弃——提前写好。人在投入之后会不断加码，因为舍不得已经花掉的时间。退出条件帮你把决策拉回理性：只看未来的投入和回报，不看已经沉没的成本。</p>"},{"n":6,"t":"估工期按过去实际耗时。","b":"<p>别按\"计划应该多快\"估，按\"同类事情上次花了多久\"估。人对自己的效率总是过于乐观，实际耗时才是可靠的尺子。估不准，就会不断欠债、不断加班。</p>"},{"n":7,"t":"拖延是在躲难受，不是不够努力。","b":"<p>你不是懒，是在逃避某件事带来的不适——太难、太无聊、怕做不好。看清这一点，处理方式就变了：不是逼自己\"努力一点\"，而是把那件事拆小、降门槛，先做五分钟。</p>"},{"n":8,"t":"新习惯按月算，别信\"21 天\"。","b":"<p>21 天养成习惯是个流传很广的说法，但没有那么神（经验判断）。多数习惯需要更久，而且会反复。按月份想，你就不会因为第三周断了而觉得自己失败——断了再接上，本来就是常态。</p>"},{"n":9,"t":"生气时别靠剧烈运动发泄。","b":"<p>打沙袋、跑一圈，看起来在释放，其实是在给情绪火上浇油。先让身体慢下来——深呼吸、走开、洗把脸。生理上平静了，心理上才谈得上理性。</p>"},{"n":10,"t":"心里压着事，可以写下来。","b":"<p>连着几天把想法和感受写下来，有帮助——能让混乱的东西变清晰。但别指望写字治病，它是整理工具，不是疗法。真有问题，还是去找专业的人。</p>"},{"n":11,"t":"睡前一小时不看发光屏幕。","b":"<p>要看就看纸书，或不开屏幕灯的墨水屏。屏幕蓝光和内容刺激都会让脑子兴奋——你以为刷手机是放松，其实是在推迟入睡。这一条见效很快，试一周就知道。</p><p>---</p>"}]},{"n":20,"t":"不要信这些：打工人常见的智商税","items":[{"n":1,"t":"不要为了\"人脉\"参加无意义的饭局。","b":"<p>散场后你连对方名字都记不全，那不是人脉，是消耗。真正的关系来自一起做成过事，不是一起吃过饭。把时间留给自己和真正在乎的人。</p>"},{"n":2,"t":"不要花钱买\"职场课\"\"向上管理课\"来解决具体困难。","b":"<p>你的问题通常不是\"缺一门课\"，而是具体场景里的具体卡点——跟领导怎么谈、同事甩锅怎么办。这些问一个过来人、看几篇具体案例，比买课有用。课程卖的是体系感，你缺的是针对性。</p>"},{"n":3,"t":"不要因为\"别人都在卷\"就加班到更晚。","b":"<p>别人卷的是他的目标，不是你的。跟着卷，你消耗的是自己的时间和健康，换来的可能只是领导一句话。看清自己要什么，比跟着人群跑重要。</p>"},{"n":4,"t":"不要相信\"吃苦一定有回报\"。","b":"<p>不看方向的吃苦，只是吃苦。同样是加班，有人积累了能力和作品，有人只是把时间耗在了重复劳动上。回报来自可积累的东西，不来自\"我很辛苦\"这个事实本身。</p>"},{"n":5,"t":"不要为了\"稳定\"长期接受低薪。","b":"<p>稳定是相对的——工资低到存不下钱，这种稳定经不起任何一次意外。别用\"至少稳定\"安慰自己，算算这笔账能撑多久。</p>"},{"n":6,"t":"不要买保健品来抵消加班伤害。","b":"<p>防脱发、抗疲劳、护肝——这些解决不了根本问题。加班伤的是睡眠、运动和整体状态，靠保健品补不回来。少熬一点、动一动、睡够，比什么瓶子都管用。</p>"},{"n":7,"t":"不要靠算命、塔罗、星座做职业决定。","b":"<p>决定要靠信息：市场行情、自身条件、具体选项的利弊。把这些摆出来分析，比问任何玄学都靠谱。把选择权交出去，本质上是不想承担决定的责任。</p>"},{"n":8,"t":"不要为了\"提升形象\"买超出收入能力的行头。","b":"<p>形象有用，但不是靠一身贵衣服撑起来的。干净、合身、得体，花不了多少钱。信用卡刷出来的精致，背后是每月的账单和焦虑。</p>"},{"n":9,"t":"不要把\"被需要\"当成\"被重视\"。","b":"<p>什么活都找你，不一定是你重要，可能只是你好说话。真正的重视伴随的是资源和回报——加薪、晋升、核心项目。只有活没有这些，那是好用，不是重视。</p>"},{"n":10,"t":"不要拿健康换短期奖金。","b":"<p>一次两次看不出差别，长年累月就是一笔还不清的债。奖金花完就没了，身体垮了要花几年养。这笔账，怎么算都不划算。</p>"},{"n":11,"t":"不要相信\"公司不会亏待你\"。","b":"<p>看合同，看制度，看实际行动，不看感情。公司对你好不好，体现在工资、福利、晋升上，不体现在年会上那句\"我们是一家人\"。这句话听着暖，但不能拿它交房租。</p>"},{"n":12,"t":"不要为了面子隐瞒失业。","b":"<p>越瞒越被动——不敢跟家里说、不敢跟朋友说，自己扛着，连帮忙的机会都没有。失业不丢人，硬撑到出事才丢人。该说就说，能求助就求助。</p><p>---</p>"}]}];
const TOTAL = DATA.reduce((s,c)=>s+c.items.length,0);
const content = document.getElementById('content');
const nav = document.getElementById('nav');
const q = document.getElementById('q');
const cnt = document.getElementById('count');
const empty = document.getElementById('empty');

document.getElementById('meta').textContent = DATA.length + ' 节 · ' + TOTAL + ' 条 · 最后核验 2026-11-18';

DATA.forEach(c=>{
  const sec = document.createElement('section');
  sec.className='chapter'; sec.id='s'+c.n;
  const h = document.createElement('h2');
  h.innerHTML='<span class="num">'+String(c.n).padStart(2,'0')+'</span>'+esc(c.t);
  sec.appendChild(h);
  c.items.forEach(it=>{
    const d=document.createElement('article');
    d.className='item'; d.dataset.text=(it.t+' '+it.b.replace(/<[^>]+>/g,' ')).toLowerCase();
    d.innerHTML='<h3><span class="num">'+it.n+'.</span>'+it.t+'</h3>'+it.b;
    d._orig=d.innerHTML;
    sec.appendChild(d);
  });
  content.appendChild(sec);
  const a=document.createElement('a'); a.href='#s'+c.n;
  a.innerHTML='<span>'+String(c.n).padStart(2,'0')+'</span>'+esc(c.t);
  nav.appendChild(a);
});

function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function highlight(el,terms){
  if(!terms.length) return;
  const walk=(node)=>{
    if(node.nodeType===3){
      let t=node.textContent, changed=false;
      terms.forEach(term=>{
        const re=new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        if(re.test(t)){ t=t.replace(re,'<mark>$1</mark>'); changed=true; }
      });
      if(changed){const span=document.createElement('span');span.innerHTML=t;node.parentNode.replaceChild(span,node);}
    } else if(node.nodeType===1 && !['MARK','SCRIPT','STYLE'].includes(node.tagName)){
      [...node.childNodes].forEach(walk);
    }
  };
  [...el.childNodes].forEach(walk);
}

function filter(){
  const terms=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown=0;
  document.querySelectorAll('.chapter').forEach(ch=>{
    let chShown=0;
    ch.querySelectorAll('.item').forEach(el=>{
      el.innerHTML=el._orig;
      const hit=!terms.length || terms.every(t=>el.dataset.text.includes(t));
      el.classList.toggle('hidden',!hit);
      if(hit){chShown++;shown++; if(terms.length) highlight(el,terms);}
    });
    ch.classList.toggle('hidden',chShown===0);
  });
  empty.classList.toggle('hidden',shown!==0||!terms.length);
  cnt.textContent = terms.length ? shown+' / '+TOTAL+' 条' : TOTAL+' 条';
}
q.addEventListener('input',filter);

// 主题切换
const root=document.documentElement;
const saved=localStorage.getItem('theme');
if(saved) root.dataset.theme=saved;
document.getElementById('theme').onclick=()=>{
  const cur=root.dataset.theme==='dark'?'light':'dark';
  root.dataset.theme=cur; localStorage.setItem('theme',cur);
};

// 滚动高亮当前章节
const links=[...nav.querySelectorAll('a')];
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));
    }
  });
},{rootMargin:'-70px 0px -75% 0px'});
document.querySelectorAll('.chapter').forEach(c=>obs.observe(c));

filter();
</script>
</body>
</html>
